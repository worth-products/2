<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Form → XML</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-6">
  <div class="w-full max-w-xl bg-white rounded-lg shadow p-6">
    <h1 class="text-2xl font-semibold mb-4">Create XML from Form</h1>

    <form id="mainForm" class="space-y-3">
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-sm">Document ID</label>
          <input name="docId" class="w-full border rounded px-2 py-1" placeholder="e.g. user123" required />
        </div>
        <div>
          <label class="block text-sm">Document Name</label>
          <input name="docName" class="w-full border rounded px-2 py-1" placeholder="e.g. Profile" required />
        </div>
      </div>

      <div>
        <label class="block text-sm">Document Type</label>
        <input name="docType" class="w-full border rounded px-2 py-1" placeholder="e.g. user-data" />
      </div>

      <div>
        <label class="block text-sm">Name</label>
        <input name="name" class="w-full border rounded px-2 py-1" />
      </div>

      <div>
        <label class="block text-sm">Email</label>
        <input name="email" type="email" class="w-full border rounded px-2 py-1" />
      </div>

      <div>
        <label class="block text-sm">Phone</label>
        <input name="phone" class="w-full border rounded px-2 py-1" />
      </div>

      <div>
        <label class="block text-sm">Address</label>
        <input name="address" class="w-full border rounded px-2 py-1" />
      </div>

      <div>
        <label class="block text-sm">Message</label>
        <textarea name="message" rows="3" class="w-full border rounded px-2 py-1"></textarea>
      </div>

      <div class="flex gap-2 mt-3">
        <button id="generateBtn" type="button" class="bg-sky-600 text-white px-4 py-2 rounded">Generate XML</button>
        <button id="downloadBtn" type="button" class="bg-green-600 text-white px-4 py-2 rounded hidden">Download XML</button>
        <button id="saveLocalBtn" type="button" class="ml-auto bg-amber-600 text-white px-4 py-2 rounded">Save to App</button>
      </div>
    </form>

    <div id="previewBox" class="mt-4 hidden">
      <h2 class="text-sm font-medium mb-2">Preview</h2>
      <pre id="xmlPreview" class="bg-slate-50 p-3 rounded text-xs max-h-64 overflow-auto"></pre>
    </div>

    <p class="mt-4 text-xs text-slate-500">Files saved to the app are stored in your browser (localStorage). Use the other pages to manage and download them.</p>
  </div>

<script>
// localStorage key
const STORAGE_KEY = 'xml_manager_docs_v1';

function getStore(){
  try{ return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); }
  catch(e){ return {}; }
}
function saveStore(store){ localStorage.setItem(STORAGE_KEY, JSON.stringify(store)); }

function xmlEscape(s){ return (s==null? '': String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&apos;'); }

function buildXml(rootName, obj){
  let xml = `<${rootName}>\n`;
  for(const k of Object.keys(obj)){
    xml += `  <${k}>${xmlEscape(obj[k])}</${k}>\n`;
  }
  xml += `</${rootName}>`;
  return xml;
}

const form = document.getElementById('mainForm');
const genBtn = document.getElementById('generateBtn');
const dlBtn = document.getElementById('downloadBtn');
const previewBox = document.getElementById('previewBox');
const xmlPreview = document.getElementById('xmlPreview');
const saveLocalBtn = document.getElementById('saveLocalBtn');

let lastXml = '';

genBtn.addEventListener('click', ()=>{
  const fd = new FormData(form);
  const meta = { docId: fd.get('docId')?.trim(), docName: fd.get('docName')?.trim() };
  if(!meta.docId || !meta.docName){ alert('Please provide Document ID and Name'); return; }
  const docType = fd.get('docType') || 'generic';
  const obj = {};
  for(const [k,v] of fd.entries()){ if(['docId','docName','docType'].includes(k)) continue; obj[k]=v; }
  const xml = buildXml('user', obj);
  lastXml = xml;
  xmlPreview.textContent = xml;
  previewBox.classList.remove('hidden');
  dlBtn.classList.remove('hidden');
});

dlBtn.addEventListener('click', ()=>{
  if(!lastXml){ alert('Generate XML first'); return; }
  const blob = new Blob([lastXml], {type:'application/xml'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download='user_data.xml'; a.click(); URL.revokeObjectURL(url);
});

saveLocalBtn.addEventListener('click', ()=>{
  const fd = new FormData(form);
  const docId = fd.get('docId')?.trim();
  const docName = fd.get('docName')?.trim();
  if(!docId || !docName){ alert('Provide doc id and name'); return; }
  const docType = fd.get('docType') || 'generic';
  const obj = {};
  for(const [k,v] of fd.entries()){ if(['docId','docName','docType'].includes(k)) continue; obj[k]=v; }
  const xml = buildXml('user', obj);
  const store = getStore();
  store[docId] = store[docId] || { type: docType, docName: docName, versions: [] };
  // ensure docName/type stored (first writer)
  store[docId].docName = docName;
  store[docId].type = docType;
  const nextV = (store[docId].versions.length? store[docId].versions[store[docId].versions.length-1].version+1 : 1);
  store[docId].versions.push({ version: nextV, timestamp: new Date().toISOString(), xml: xml });
  saveStore(store);
  alert('Saved locally as version '+nextV);
});
</script>
</body>
</html>
