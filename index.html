<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Upload & Manage XML</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen p-6">
  <div class="max-w-3xl mx-auto">
    <h1 class="text-2xl font-semibold mb-4">Upload / Import XML</h1>

    <div class="bg-white rounded shadow p-4 mb-4">
      <label class="block text-sm mb-1">Select file to upload (.xml)</label>
      <input id="fileInput" type="file" accept=".xml,application/xml" />

      <div class="grid grid-cols-3 gap-2 mt-3">
        <input id="docId" placeholder="Document ID" class="border rounded px-2 py-1" />
        <input id="docName" placeholder="Document Name" class="border rounded px-2 py-1" />
        <input id="docType" placeholder="Document Type" class="border rounded px-2 py-1" />
      </div>

      <div class="flex gap-2 mt-3">
        <button id="uploadBtn" class="bg-sky-600 text-white px-4 py-2 rounded">Upload & Save</button>
        <button id="pasteBtn" class="bg-slate-100 px-4 py-2 rounded">Paste XML</button>
        <button id="showAll" class="ml-auto text-sm text-slate-600">Show all</button>
      </div>

      <div id="pasteAreaWrap" class="mt-3 hidden">
        <textarea id="pasteArea" rows="8" class="w-full border rounded px-2 py-1"></textarea>
        <div class="flex justify-end mt-2"><button id="savePaste" class="bg-amber-600 text-white px-3 py-1 rounded">Save Pasted</button></div>
      </div>

      <div id="msg" class="text-sm text-green-700 mt-3 hidden"></div>
    </div>

    <div class="bg-white rounded shadow p-4">
      <h2 class="font-medium mb-2">Stored Documents (summary)</h2>
      <div id="summary" class="text-sm"></div>
    </div>
  </div>

<script>
const STORAGE_KEY = 'xml_manager_docs_v1';
function getStore(){ try{ return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); }catch(e){return {}; } }
function saveStore(s){ localStorage.setItem(STORAGE_KEY, JSON.stringify(s)); }
function parseXml(xmlText){ const p = new DOMParser().parseFromString(xmlText,'application/xml'); if(p.querySelector('parsererror')) throw new Error('Invalid XML'); return p; }

const fileInput = document.getElementById('fileInput');
const uploadBtn = document.getElementById('uploadBtn');
const docIdInput = document.getElementById('docId');
const docNameInput = document.getElementById('docName');
const docTypeInput = document.getElementById('docType');
const msg = document.getElementById('msg');
const pasteBtn = document.getElementById('pasteBtn');
const pasteAreaWrap = document.getElementById('pasteAreaWrap');
const pasteArea = document.getElementById('pasteArea');
const savePaste = document.getElementById('savePaste');
const showAll = document.getElementById('showAll');
const summary = document.getElementById('summary');

uploadBtn.addEventListener('click', async ()=>{
  const f = fileInput.files[0];
  const docId = docIdInput.value.trim();
  const docName = docNameInput.value.trim();
  const docType = docTypeInput.value.trim() || 'generic';
  if(!docId || !docName){ alert('Enter Document ID and Name'); return; }
  if(!f){ alert('Choose a file'); return; }
  const txt = await f.text();
  try{ parseXml(txt); } catch(e){ alert('Invalid XML: '+e.message); return; }
  const store = getStore();
  store[docId] = store[docId] || { docName: docName, type: docType, versions: [] };
  // update meta
  store[docId].docName = docName;
  store[docId].type = docType;
  const v = (store[docId].versions.length? store[docId].versions[store[docId].versions.length-1].version+1 : 1);
  store[docId].versions.push({ version: v, timestamp: new Date().toISOString(), xml: txt });
  saveStore(store);
  showMsg('Uploaded as version '+v);
  fileInput.value='';
  renderSummary();
});

pasteBtn.addEventListener('click', ()=> pasteAreaWrap.classList.toggle('hidden'));
savePaste.addEventListener('click', ()=>{
  const txt = pasteArea.value.trim();
  const docId = docIdInput.value.trim();
  const docName = docNameInput.value.trim();
  const docType = docTypeInput.value.trim() || 'generic';
  if(!docId || !docName){ alert('Enter Document ID/Name'); return; }
  if(!txt){ alert('Paste XML first'); return; }
  try{ parseXml(txt); } catch(e){ alert('Invalid XML: '+e.message); return; }
  const store = getStore();
  store[docId] = store[docId] || { docName: docName, type: docType, versions: [] };
  store[docId].docName = docName; store[docId].type = docType;
  const v = (store[docId].versions.length? store[docId].versions[store[docId].versions.length-1].version+1 : 1);
  store[docId].versions.push({ version: v, timestamp: new Date().toISOString(), xml: txt });
  saveStore(store);
  pasteArea.value=''; pasteAreaWrap.classList.add('hidden'); renderSummary(); showMsg('Pasted saved as v'+v);
});

function showMsg(t){ msg.textContent=t; msg.classList.remove('hidden'); setTimeout(()=>msg.classList.add('hidden'),3000); }

showAll.addEventListener('click', ()=>{ const s = getStore(); if(!Object.keys(s).length) alert('No documents'); else {
  let out=''; for(const id of Object.keys(s)){
    out += `${id} • ${s[id].docName} • ${s[id].type} • versions:${s[id].versions.length}\n`;
  }
  alert(out);
}});

function renderSummary(){ const s = getStore(); if(!Object.keys(s).length){ summary.textContent='(no documents stored yet)'; return; }
  let html=''; for(const id of Object.keys(s)){
    const doc = s[id];
    const last = doc.versions[doc.versions.length-1];
    html += `<div class="border rounded p-2 mb-2"><div class="flex justify-between"><div><b>${id}</b> — ${doc.docName} <div class="text-xs text-slate-500">type: ${doc.type}</div></div><div class="text-xs">v${last.version}</div></div></div>`;
  }
  summary.innerHTML = html;
}

renderSummary();
</script>
</body>

              <div class="flex justify-end mt-2"><button id="pasteSaveBtn" class="bg-amber-600 text-white px-3 py-1 rounded">Save Pasted XML</button></div>
            </div>

            <div id="uploadMsg" class="text-sm text-green-700 hidden mt-2"></div>
          </div>
        </div>
      </section>

      <!-- PAGE 3: Browse / View / Edit -->
      <section id="page-browse" class="hidden space-y-4">
        <div class="bg-white p-6 rounded shadow">
          <h2 class="text-lg font-medium mb-3">Browse Uploaded Files by Document ID</h2>

          <div class="flex gap-2 items-center">
            <input id="browseDocId" placeholder="Enter Document ID (e.g. user123)" class="w-2/3 border rounded px-2 py-1" />

        </div>
      </section>

    </main>

  <!-- Modal Popup for form editing -->
  <div id="modal" class="fixed inset-0 hidden items-center justify-center modal-backdrop z-50">
    <div class="bg-white rounded shadow-lg w-11/12 max-w-2xl p-4">
      <div class="flex items-start justify-between">
        <h3 id="modalTitle" class="text-lg font-medium">Edit Document</h3>
        <button id="modalClose" class="text-slate-600">Close</button>
      </div>
      <div class="mt-3">
        <div class="text-xs text-slate-500 mb-2">Document: <span id="modalDocMeta"></span></div>
        <form id="modalForm" class="space-y-2 max-h-[60vh] overflow-auto">
          <!-- dynamic fields will be injected here -->
        </form>

        <div class="flex gap-2 mt-3">
          <button id="modalSave" class="bg-green-600 text-white px-4 py-2 rounded">Save as new version</button>
          <button id="downloadXmlFromModal" class="bg-sky-600 text-white px-4 py-2 rounded">Download XML</button>
          <button id="downloadPdfFromModal" class="bg-amber-600 text-white px-4 py-2 rounded">Download PDF</button>
          <div class="ml-auto text-sm text-slate-500" id="modalVersionInfo"></div>
        </div>
      </div>
    </div>
  </div>

<script>
/* ========= IndexedDB wrapper (simple) ========= */
const DB_NAME = 'xml_manager_db_v1';
const STORE_NAME = 'files';

function openDb() {
  return new Promise((res, rej) => {
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = (e) => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains(STORE_NAME)) {
        const store = db.createObjectStore(STORE_NAME, { keyPath: 'id', autoIncrement: true });
        store.createIndex('docKey', ['docId', 'docName'], { unique: false });
        store.createIndex('docId', 'docId', { unique: false });
      }
    };
    req.onsuccess = () => res(req.result);
    req.onerror = () => rej(req.error);
  });
}

async function addFileRecord(record) {
  const db = await openDb();
  return new Promise((res, rej) => {
    const tx = db.transaction(STORE_NAME, 'readwrite');
    const store = tx.objectStore(STORE_NAME);
    store.add(record).onsuccess = e => res(e.target.result);
    tx.onerror = e => rej(e);
  });
}

async function getRecordsByDocId(docId) {
  const db = await openDb();
  return new Promise((res, rej) => {
    const tx = db.transaction(STORE_NAME, 'readonly');
    const store = tx.objectStore(STORE_NAME);
    const idx = store.index('docId');
    const req = idx.getAll(IDBKeyRange.only(docId));
    req.onsuccess = () => res(req.result);
    req.onerror = () => rej(req.error);
  });
}

async function getAllRecords() {
  const db = await openDb();
  return new Promise((res, rej) => {
    const tx = db.transaction(STORE_NAME, 'readonly');
    const store = tx.objectStore(STORE_NAME);
    const req = store.getAll();
    req.onsuccess = () => res(req.result);
    req.onerror = () => rej(req.error);
  });
}

async function getLatestVersionFor(docId, docName) {
  const db = await openDb();
  return new Promise((res, rej) => {
    const tx = db.transaction(STORE_NAME, 'readonly');
    const store = tx.objectStore(STORE_NAME);
    const idx = store.index('docKey');
    const range = IDBKeyRange.only([docId, docName]);
    const req = idx.getAll(range);
    req.onsuccess = () => {
      const arr = req.result;
      if (!arr || arr.length === 0) return res(null);
      arr.sort((a,b)=>b.version - a.version);
      res(arr[0]);
    };
    req.onerror = () => rej(req.error);
  });
}

/* ======= Utilities ======= */
function xmlEscape(str) {
  if (str == null) return '';
  return String(str)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&apos;');
}

function buildXmlFromObj(rootName, obj) {
  // simple conversion for flat object; nested tags would require recursion
  let xml = `<${rootName}>\\n`;
  for (const k of Object.keys(obj)) {
    xml += `  <${k}>${xmlEscape(obj[k])}</${k}>\\n`;
  }
  xml += `</${rootName}>`;
  return xml;
}

function parseXmlToObject(xmlText) {
  const parser = new DOMParser();
  const doc = parser.parseFromString(xmlText, 'application/xml');
  const parseError = doc.querySelector('parsererror');
  if (parseError) throw new Error('Invalid XML');
  // Map: each child element of root -> key:value
  const root = doc.documentElement;
  const obj = {};
  // if multiple child nodes with same name -> join with newline
  for (const child of Array.from(root.children)) {
    const key = child.tagName;
    const val = child.textContent || '';
    if (obj[key] !== undefined) {
      obj[key] = obj[key] + "\\n" + val;
    } else {
      obj[key] = val;
    }
  }
  return { rootName: root.tagName, data: obj };
}

/* ======= Page logic ======= */

// Simple SPA nav
document.querySelectorAll('.nav-btn').forEach(btn=>{
  btn.addEventListener('click', ()=> {
    const target = btn.dataset.nav;
    showPage(target);
  });
});
function showPage(key) {
  document.querySelectorAll('main section').forEach(s => s.classList.add('hidden'));
  document.getElementById('page-' + key).classList.remove('hidden');
  window.scrollTo(0,0);
}
// default
showPage('form');

/* -------- Page 1: Form → XML ---------- */
const fixedForm = document.getElementById('fixedForm');
const genXmlBtn = document.getElementById('genXmlBtn');
const xmlPreviewBox = document.getElementById('xmlPreviewBox');
const xmlPreview = document.getElementById('xmlPreview');
const downloadXmlBtn = document.getElementById('downloadXmlBtn');
const clearForm = document.getElementById('clearForm');

genXmlBtn.addEventListener('click', ()=>{
  const fd = new FormData(fixedForm);
  const obj = {};
  for (const [k,v] of fd.entries()) obj[k] = v;
  const xml = buildXmlFromObj('user', obj);
  xmlPreview.textContent = xml;
  xmlPreviewBox.classList.remove('hidden');
  downloadXmlBtn.classList.remove('hidden');
});

downloadXmlBtn.addEventListener('click', ()=>{
  const xml = xmlPreview.textContent;
  const blob = new Blob([xml], {type: 'application/xml'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'user_data.xml';
  a.click();
  URL.revokeObjectURL(url);
});
clearForm.addEventListener('click', ()=> {
  fixedForm.reset();
  xmlPreview.textContent = '';
  xmlPreviewBox.classList.add('hidden');
  downloadXmlBtn.classList.add('hidden');
});

/* -------- Page 2: Upload ---------- */
const fileInput = document.getElementById('fileInput');
const uploadBtn = document.getElementById('uploadBtn');
const uploadDocId = document.getElementById('uploadDocId');
const uploadDocName = document.getElementById('uploadDocName');
const uploadDocType = document.getElementById('uploadDocType');
const uploadMsg = document.getElementById('uploadMsg');
const pasteXmlBtn = document.getElementById('pasteXmlBtn');
const pasteBox = document.getElementById('pasteBox');
const pasteArea = document.getElementById('pasteArea');
const pasteSaveBtn = document.getElementById('pasteSaveBtn');
const showAllBtn = document.getElementById('showAllBtn');

uploadBtn.addEventListener('click', async ()=>{
  const file = fileInput.files[0];
  const docId = uploadDocId.value.trim();
  const docName = uploadDocName.value.trim();
  const docType = uploadDocType.value.trim() || 'generic';
  if (!docId || !docName) { alert('Please enter Document ID and Name'); return; }
  if (!file) { alert('Please select a file'); return; }

  const text = await file.text();
  // validate xml
  try {
    parseXmlToObject(text);
  } catch (e) {
    alert('Invalid XML file: ' + e.message);
    return;
  }

  // find latest version
  const latest = await getLatestVersionFor(docId, docName);
  const nextVersion = latest ? (latest.version + 1) : 1;
  await addFileRecord({
    docId, docName, docType, xmlText: text, version: nextVersion, timestamp: new Date().toISOString()
  });
  uploadMsg.textContent = `Uploaded as version ${nextVersion}.`;
  uploadMsg.classList.remove('hidden');
  setTimeout(()=>uploadMsg.classList.add('hidden'), 3000);
  fileInput.value = '';
});

pasteXmlBtn.addEventListener('click', ()=> {
  pasteBox.classList.toggle('hidden');
});
pasteSaveBtn.addEventListener('click', async ()=>{
  const text = pasteArea.value.trim();
  const docId = uploadDocId.value.trim();
  const docName = uploadDocName.value.trim();
  const docType = uploadDocType.value.trim() || 'generic';
  if (!docId || !docName) { alert('Please enter Document ID and Name'); return; }
  if (!text) { alert('Paste XML content first'); return; }
  try { parseXmlToObject(text); } catch(e) { alert('Invalid XML: ' + e.message); return; }
  const latest = await getLatestVersionFor(docId, docName);
  const nextVersion = latest ? (latest.version + 1) : 1;
  await addFileRecord({ docId, docName, docType, xmlText: text, version: nextVersion, timestamp: new Date().toISOString() });
  uploadMsg.textContent = `Pasted content saved as version ${nextVersion}.`;
  uploadMsg.classList.remove('hidden');
  setTimeout(()=>uploadMsg.classList.add('hidden'), 3000);
  pasteArea.value = '';
  pasteBox.classList.add('hidden');
});

showAllBtn.addEventListener('click', async ()=>{
  const all = await getAllRecords();
  if (!all.length) { alert('No stored files yet.'); return; }
  // show simple list
  let out = 'Stored files:\\n';
  all.sort((a,b)=>a.docId.localeCompare(b.docId) || a.docName.localeCompare(b.docName) || b.version - a.version);
  for (const r of all) {
    out += `${r.docId} · ${r.docName} · v${r.version} · ${r.timestamp}\\n`;
  }
  alert(out);
});

/* -------- Page 3: Browse / Edit ---------- */
const browseDocId = document.getElementById('browseDocId');
const browseBtn = document.getElementById('browseBtn');
const filesList = document.getElementById('filesList');
const noFilesMsg = document.getElementById('noFilesMsg');
const clearBrowse = document.getElementById('clearBrowse');

browseBtn.addEventListener('click', async ()=> {
  const id = browseDocId.value.trim();
  if (!id) { alert('Enter Document ID'); return; }
  const recs = await getRecordsByDocId(id);
  filesList.innerHTML = '';
  if (!recs || recs.length === 0) {
    noFilesMsg.classList.remove('hidden');
    return;
  }
  noFilesMsg.classList.add('hidden');

  // group by docName
  const groups = {};
  for (const r of recs) {
    const key = r.docName + '||' + r.docType;
    groups[key] = groups[key] || [];
    groups[key].push(r);
  }

  // render
  for (const [k, arr] of Object.entries(groups)) {
    const [name, type] = k.split('||');
    const card = document.createElement('div');
    card.className = 'border rounded p-3 bg-white';
    const header = document.createElement('div');
    header.className = 'flex items-center justify-between';
    header.innerHTML = `<div><div class="font-medium">${name}</div><div class="text-xs text-slate-500">${type}</div></div>
      <div class="text-xs text-slate-400">versions: ${arr.length}</div>`;
    card.appendChild(header);

    arr.sort((a,b)=>b.version - a.version);
    const list = document.createElement('div');
    list.className = 'mt-2 text-sm space-y-1';
    for (const item of arr) {
      const row = document.createElement('div');
      row.className = 'flex items-center gap-2';
      row.innerHTML = `<div class="flex-1 text-xs"><b>v${item.version}</b> • ${new Date(item.timestamp).toLocaleString()}</div>`;
      const viewBtn = document.createElement('button');
      viewBtn.className = 'px-2 py-1 rounded text-xs bg-sky-600 text-white';
      viewBtn.textContent = 'Open';
      viewBtn.addEventListener('click', ()=> openModalForRecord(item));
      const downloadBtn = document.createElement('button');
      downloadBtn.className = 'px-2 py-1 rounded text-xs bg-green-600 text-white';
      downloadBtn.textContent = 'Download XML';
      downloadBtn.addEventListener('click', ()=> downloadXmlText(item.xmlText, `${item.docName}_v${item.version}.xml`));
      row.appendChild(viewBtn);
      row.appendChild(downloadBtn);
      list.appendChild(row);
    }
    card.appendChild(list);
    filesList.appendChild(card);
  }
});
clearBrowse.addEventListener('click', ()=> {
  browseDocId.value = '';
  filesList.innerHTML = '';
  noFilesMsg.classList.add('hidden');
});

/* -------- Modal operations -------- */
const modal = document.getElementById('modal');
const modalTitle = document.getElementById('modalTitle');
const modalDocMeta = document.getElementById('modalDocMeta');
const modalForm = document.getElementById('modalForm');
const modalSave = document.getElementById('modalSave');
const modalClose = document.getElementById('modalClose');
const modalVersionInfo = document.getElementById('modalVersionInfo');
const downloadXmlFromModal = document.getElementById('downloadXmlFromModal');
const downloadPdfFromModal = document.getElementById('downloadPdfFromModal');

let currentModalRecord = null; // the version record being viewed (not edited in-place)

function openModalForRecord(record) {
  currentModalRecord = record;
  modalTitle.textContent = `Edit: ${record.docName}`;
  modalDocMeta.textContent = `${record.docId} • ${record.docType}`;
  modalForm.innerHTML = '';
  modalVersionInfo.textContent = `v${record.version} • ${new Date(record.timestamp).toLocaleString()}`;

  // parse xml to fields
  let parsed;
  try { parsed = parseXmlToObject(record.xmlText); } catch(e) { alert('Error parsing XML: ' + e); return; }
  const root = parsed.rootName;
  const data = parsed.data;

  // for each field, create input
  for (const k of Object.keys(data)) {
    const wrap = document.createElement('div');
    wrap.className = 'space-y-1';
    const lbl = document.createElement('label');
    lbl.className = 'text-sm font-medium';
    lbl.textContent = k;
    const input = document.createElement('textarea');
    input.className = 'w-full border rounded px-2 py-1 text-sm';
    input.rows = 2;
    input.name = k;
    input.value = data[k];
    wrap.appendChild(lbl);
    wrap.appendChild(input);
    modalForm.appendChild(wrap);
  }

  // also allow editing root name?
  const rootWrap = document.createElement('div');
  rootWrap.className = 'mt-
